[project]
name = "bytestts"
dynamic = ["version"]
description = "Text-to-speech for Python: VITS voices on ONNX Runtime, as a library and a CLI"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Core: the plan's five, plus inflect (MIT; English numbers, Task 4, 2026-11-17). PyTorch only in [train] and tools/.
dependencies = [
    "onnxruntime",
    "numpy",
    "pysbd",
    "platformdirs",
    "requests",
    "inflect>=7.6.0",
]

keywords = ["text-to-speech", "tts", "speech-synthesis", "vits", "onnx", "onnxruntime"]

[project.urls]
Homepage = "https://github.com/jared0565/bytesTTS"
Documentation = "https://github.com/jared0565/bytesTTS/blob/main/docs/user-guide.md"
Issues = "https://github.com/jared0565/bytesTTS/issues"
Changelog = "https://github.com/jared0565/bytesTTS/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# onnxruntime-gpu only: users install CUDA 13 + cuDNN 9 themselves; no proprietary NVIDIA wheels here (P0.9).
gpu = ["onnxruntime-gpu"]
server = ["fastapi", "uvicorn"]
# The control panel (`bytestts gui`). pywebview (the app window, WebView2) only on Windows; elsewhere the panel
# opens in the browser. soundfile joins in stage 2, the first stage to use it.
gui = ["fastapi", "uvicorn", "pywebview>=6.2.1,<7; sys_platform == 'win32'"]
train = ["torch", "safetensors", "onnx", "soundfile"]
# Selector extras: they only choose torch's index. Pick exactly one with [train].
torch-cpu = ["torch"]
torch-cu130 = ["torch"]

[project.scripts]
bytestts = "bytestts.cli:main"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pyyaml", "types-requests", "httpx2"]  # httpx2: Starlette's test client
eval = ["faster-whisper==1.2.1"]  # maintainer-only ASR for WER (P0.1); never shipped

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bytestts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bytestts"]

[tool.uv]
conflicts = [
  [{ extra = "torch-cpu" }, { extra = "torch-cu130" }],
  [{ extra = "gpu" }, { extra = "torch-cpu" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "torch-cpu" },
  { index = "pytorch-cu130", extra = "torch-cu130" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "parity: compares against TTS-dev golden data; needs BYTESTTS_PARITY_VOICE_DIR (en) or BYTESTTS_PARITY_ROOT (CSS10, VCTK)",
  "quality: RTF and WER measurement",
  "gpu: needs a working CUDA execution provider",
  "network: uses the network",
  "espeak: needs espeak-ng",
]
addopts = "--import-mode=importlib -m 'not parity and not quality and not gpu and not network'"
faulthandler_timeout = 120  # a hung test dumps every thread's stack (Task 3 ledger)

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "RUF001"]  # RUF001: IPA phoneme strings are intended in tests

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "bytestts.train.*"
disallow_untyped_calls = false
disallow_subclassing_any = false  # nn.Module is Any where torch is absent (aramid gate, machine interpreter)
disallow_any_generics = false
warn_return_any = false

# onnxruntime and pysbd ship no stubs. inflect, torch, safetensors and onnx do, but aramid's gate runs
# mypy on the machine interpreter, which lacks them; `uv run mypy` (dev venv, CI) still checks them fully
# (Task 4 and Task 9 ledger).
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "pysbd.*", "inflect", "inflect.*", "torch", "torch.*",
          "safetensors", "safetensors.*", "onnx", "onnx.*", "webview", "webview.*"]
ignore_missing_imports = true
